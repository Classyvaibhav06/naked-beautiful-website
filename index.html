    ];

    const grid = document.getElementById('sites-grid');
    const searchInput = document.getElementById('search');
    const filterBtns = document.querySelectorAll('.filter-btn');

    let currentCat = 'all';
    let searchQuery = '';

    function render() {
      const filtered = sites.filter(s => {
        const matchesCat = currentCat === 'all' || s.category === currentCat;
        const matchesSearch = s.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              s.desc.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              s.catLabel.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCat && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div style="grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: var(--text-dim); font-family: 'JetBrains Mono', monospace;">
            <p>No design references matched your search query.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(site => `
        <a href="${site.url}" target="_blank" rel="noopener noreferrer" class="card">
          <div>
            <div class="card-top">
              <span class="card-num">#${site.id}</span>
              <span class="card-category">${site.catLabel}</span>
            </div>
            <h2 class="card-title">
              ${site.name}
              <svg class="card-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="7" y1="17" x2="17" y2="7"></line>
                <polyline points="7 7 17 7 17 17"></polyline>
              </svg>
            </h2>
            <p class="card-desc">${site.desc}</p>
          </div>
          <div class="card-footer">
            <span class="card-url">${site.url.replace(/^https?:\/\/(www\.)?/, '')}</span>
          </div>
        </a>
      `).join('');
    }

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      render();
    });

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCat = btn.dataset.cat;
        render();
      });
    });

    render();
  </script>
</body>
</html>
